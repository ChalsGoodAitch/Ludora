name: ludora
services:
  db:
    image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
    environment:
      MARIADB_DATABASE: ludora
      MARIADB_USER: ludora
      MARIADB_PASSWORD: ${LUDORA_DB_PASSWORD:-local-development-only}
      MARIADB_ROOT_PASSWORD: ${LUDORA_DB_ROOT_PASSWORD:-local-root-development-only}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.4-php8.4-apache@sha256:63dbbdf2c9ea29a2e4f417c0d4e7c4b821725d115127f70838dbbc5051ee4db0
    ports:
      - "127.0.0.1:${LUDORA_HTTP_PORT:-8095}:80"
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ludora
      WORDPRESS_DB_PASSWORD: ${LUDORA_DB_PASSWORD:-local-development-only}
      WORDPRESS_DB_NAME: ludora
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '256M');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('LUDORA_MAIL_HOST', 'mailpit');
    volumes: &wp_volumes
      - wp:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/ludora.ini:ro
      - ./themes/ludora:/var/www/html/wp-content/themes/ludora
      - ./themes/ludora-child:/var/www/html/wp-content/themes/ludora-child
      - ./plugins/ludora-booking:/var/www/html/wp-content/plugins/ludora-booking
      - ./tests:/var/www/html/ludora-tests
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.4@sha256:37b7e3ed9b537788756f9b5c6dd8ec7c3f3053ee707abc67c776e453ba8f9e55
    user: '33:33'
    environment: *wp_environment
    volumes: *wp_volumes
    depends_on:
      - wordpress
    entrypoint: [wp]
    profiles: [tools]
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports:
      - "127.0.0.1:${LUDORA_MAIL_PORT:-8029}:8025"
volumes:
  db:
  wp:
